}

}

    100% { box-shadow: 0 0 20px #4169e1, -10px -10px 30px #9932cc; }
}

     
.glitch-aura {

}

    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
    100% { transform: translate(0); }
}

}

        <div class="security-hub" style="display: flex; justify-content: center; text-align: center;">

            <span class="info-tag">CONTACT :</span>
            <a href="mailto:supportanimescope@gmail.com" class="ultra-email">supportanimescope@gmail.com</a>

    </div> <div class="profile-section">

            <span id="complete-head">✔ COMPLETED</span>
            <button class="clear-profile-btn" onclick="clearList('completed')">CLEAR ALL</button>
        </h2>
        <div id="completed-list" class="profile-grid"></div>

<div class="profile-section">
    <h2 class="section-title">
        <span id="fav-head">❤️ FAVOURITES</span>
        <button class="clear-profile-btn" onclick="clearList('favorites')">CLEAR ALL</button>
    </h2>
    <div id="favorites-list" class="profile-grid"></div>
</div>

<div class="profile-section">
    <h2 class="section-title">
        <span id="watch-head">🔖 WATCH LATER</span>
        <button class="clear-profile-btn" onclick="clearList('watchlist')">CLEAR ALL</button>
    </h2>
    <div id="watchlist-list" class="profile-grid"></div>
</div>

<script src="badges.js"></script>

<script>
     
if (localStorage.getItem("animeTheme") === "light") document.body.classList.add("light-theme");

const user = localStorage.getItem("currentUser");

     


     
const favKey = "favorites_" + user;
const watchKey = "watchlist_" + user;
const completeKey = "completed_" + user;

     
let favorites = JSON.parse(localStorage.getItem(favKey)) || [];
let watchLater = JSON.parse(localStorage.getItem(watchKey)) || [];
let completed = JSON.parse(localStorage.getItem(completeKey)) || [];

     
// --- DATABASE IDENTITY FETCH ---
async function loadIdentity() {
    try {
        // Fetch everything directly from the mainframe!
        const res = await fetch(`http://localhost:5000/api/users/data/${user}`);
        if (!res.ok) throw new Error("Failed to summon data");

        const data = await res.json();

        // 1. Update Username (Gold Text)
        document.getElementById("display-username").innerText = user.toUpperCase();

        // 2. Update Gmail (Platinum Text)
        document.getElementById("display-gmail").innerText = data.email || "UNKNOWN@GMAIL.COM";

        // 3. Update Join Date using Mongoose's 'createdAt' timestamp
        const date = new Date(data.createdAt);
        document.getElementById("display-join-date").innerText = date.toLocaleDateString('en-GB', {
            day: 'numeric', month: 'long', year: 'numeric'
        });

        // Trigger Badges using the real join date from the cloud
        updateBadges(data.createdAt);

    } catch (error) {
        console.error("Identity Error:", error);
        document.getElementById("display-username").innerText = user.toUpperCase();
        document.getElementById("display-gmail").innerText = "CONNECTION LOST";
        document.getElementById("display-join-date").innerText = "---";
    }
}

// Update this function to accept the real cloud date
function updateBadges(joinDateString) {
    const joinDate = new Date(joinDateString);
    const now = new Date();
    const monthsJoined = (now.getFullYear() - joinDate.getFullYear()) * 12 + (now.getMonth() - joinDate.getMonth());

    const sBadge = getEarnedBadge('pathOfSorcerer', completed.length);
    const cBadge = getEarnedBadge('chronosArchive', monthsJoined);

    const sEl = document.getElementById("sorcerer-badge");
    const cEl = document.getElementById("chronos-badge");

    if(sBadge && sEl) {
        sEl.innerText = sBadge.name.toUpperCase();      
        sEl.style.color = sBadge.color;
        sEl.style.borderColor = sBadge.color;
        sEl.className = "active-badge " + sBadge.aura;
        sEl.style.boxShadow = `0 0 15px ${sBadge.color}44`;      
    }
    if(cBadge && cEl) {
        cEl.innerText = cBadge.name.toUpperCase();      
        cEl.style.color = cBadge.color;
        cEl.style.borderColor = cBadge.color;
        cEl.className = "active-badge " + cBadge.aura;
        cEl.style.boxShadow = `0 0 15px ${cBadge.color}44`;      
    }
}

     
async function loadList(items, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    
    if(containerId === "favorites-list") document.getElementById("fav-head").innerText = `❤️ FAVOURITES (${items.length})`;
    if(containerId === "watchlist-list") document.getElementById("watch-head").innerText = `🔖 WATCH LATER (${items.length})`;
    if(containerId === "completed-list") document.getElementById("complete-head").innerText = `✔ COMPLETED (${items.length})`;

    if (!items || items.length === 0) {
        container.innerHTML = `<p class="empty-msg">Nothing here yet...</p>`;
        return;
    }

    for (let item of items) {
        let data = (typeof item === 'object' && item !== null) ? item : null;
        if (!data) {
            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime/${item}`);
                const json = await res.json();
                data = json.data;
            } catch (e) { continue; }
        }
        if (!data) continue;

        
        let auraClass = "rating-low";      
        const score = data.score || 0;
        if (score >= 8) auraClass = "rating-best";
        else if (score >= 5.0) auraClass = "rating-good";

        const card = document.createElement("div");
        card.className = "anime-card";
        
        let actionButtons = "";
        if (containerId === "completed-list") {
            actionButtons = `<span class="action-btn complete-active" onclick="removeCompleted(${data.mal_id})">✔</span>`;
        } else if (containerId === "favorites-list") {
            actionButtons = `
                <span class="action-btn remove-action" onclick="removeFavorite(${data.mal_id})">❤️</span>
                <span class="action-btn add-action" onclick="favToWatch(${data.mal_id})">🔖</span>`;
        } else {
            actionButtons = `
                <span class="action-btn add-action" onclick="watchToFav(${data.mal_id})">❤️</span>
                <span class="action-btn remove-action" onclick="removeWatch(${data.mal_id})">🔖</span>`;
        }

      card.innerHTML = `
            <div class="card-actions">${actionButtons}</div>
            <a href="anime.html?id=${data.mal_id}" style="text-decoration:none;color:inherit">
                <img src="${data.images.jpg.image_url}" loading="lazy">
                <div class="quick-look">
                    <p>Type: ${data.type}</p>
                    <p>Eps: ${data.episodes}</p>
                </div>
                <h3 style="font-size:11px;padding:10px 10px 0;height:35px;overflow:hidden; margin-bottom: 40px;">
                    ${data.title_english || data.title}
                </h3>
                <div class="rating ${auraClass}">⭐ ${data.score || 'N/A'}</div>
            </a>`;
        container.appendChild(card);
    }
}
     
function refreshUI() {
         
    loadIdentity(); 

         
    loadList(completed, "completed-list");
    loadList(favorites, "favorites-list");
    loadList(watchLater, "watchlist-list");
}
const savedPos = sessionStorage.getItem("profileScrollPos");
    if (savedPos) {
        window.scrollTo({ top: parseInt(savedPos), behavior: 'instant' });
        sessionStorage.removeItem("profileScrollPos");
    }
     
// REMOVE FROM FAVOURITES
async function removeFavorite(id) {
    try {
        await fetch('http://localhost:5000/api/users/toggle-list', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: user,
                listType: 'favourites',
                anime: { mal_id: id }, // Send the ID so the backend can pull it
                action: 'remove'
            })
        });
    } catch (e) { console.error("DB Sync Failed", e); }

    favorites = favorites.filter(i => (i.mal_id || i) !== id);
    localStorage.setItem(favKey, JSON.stringify(favorites));
    refreshUI();
}

// REMOVE FROM WATCH LATER
async function removeWatch(id) {
    try {
        await fetch('http://localhost:5000/api/users/toggle-list', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: user,
                listType: 'watchLater',
                anime: { mal_id: id },
                action: 'remove'
            })
        });
    } catch (e) { console.error("DB Sync Failed", e); }

    watchLater = watchLater.filter(i => (i.mal_id || i) !== id);
    localStorage.setItem(watchKey, JSON.stringify(watchLater));
    refreshUI();
}

// REMOVE FROM COMPLETED
async function removeCompleted(id) {
    try {
        await fetch('http://localhost:5000/api/users/toggle-list', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: user,
                listType: 'completed',
                anime: { mal_id: id },
                action: 'remove'
            })
        });
    } catch (e) { console.error("DB Sync Failed", e); }

    completed = completed.filter(i => (i.mal_id || i) !== id);
    localStorage.setItem(completeKey, JSON.stringify(completed));
    refreshUI();
}

// SYNC: Move a Favourite to Watch Later
async function favToWatch(id) {
    const item = favorites.find(i => (i.mal_id || i) === id);
    if (item && !watchLater.some(w => (w.mal_id || w) === id)) {
        // --- MAINFRAME SYNC: Add to Watch Later ---
        try {
            await fetch('http://localhost:5000/api/users/toggle-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: user,
                    listType: 'watchLater',
                    anime: item,
                    action: 'add'
                })
            });
            console.log("MAINFRAME: Anime added to Watch Later.");
        } catch (e) {
            console.error("Database sync failed:", e);
        }

        // Local Update
        watchLater.push(item);
        localStorage.setItem(watchKey, JSON.stringify(watchLater));
        refreshUI();
    }
}

// SYNC: Move a Watch Later to Favourites
async function watchToFav(id) {
    const item = watchLater.find(i => (i.mal_id || i) === id);
    if (item && !favorites.some(f => (f.mal_id || f) === id)) {
        // --- MAINFRAME SYNC: Add to Favourites ---
        try {
            await fetch('http://localhost:5000/api/users/toggle-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: user,
                    listType: 'favourites',
                    anime: item,
                    action: 'add'
                })
            });
            console.log("MAINFRAME: Anime added to Favourites.");
        } catch (e) {
            console.error("Database sync failed:", e);
        }

        // Local Update
        favorites.push(item);
        localStorage.setItem(favKey, JSON.stringify(favorites));
        refreshUI();
    }
}

async function clearList(listType) {
    const user = localStorage.getItem("currentUser");
    if (!user) return;

    // 1. MAP UI NAMES TO DATABASE NAMES
    // This is the fix! UI 'favorites' -> DB 'favourites' | UI 'watchlist' -> DB 'watchLater'
    let dbListType = listType;
    if (listType === 'favorites') dbListType = 'favourites';
    if (listType === 'watchlist') dbListType = 'watchLater';

    if (confirm(`ARE YOU SURE? This will permanently wipe your ${listType} list from the cloud.`)) {
        try {
            // 2. TELL THE BACKEND TO NUKE THE LIST
            const response = await fetch('http://localhost:5000/api/users/clear-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: user, 
                    listType: dbListType 
                })
            });

            if (!response.ok) throw new Error("Failed to clear database");
            
            console.log(`MAINFRAME: ${dbListType} wiped successfully.`);

            // 3. WIPE LOCAL STORAGE AND UPDATE UI
            if (listType === 'completed') { 
                localStorage.removeItem(completeKey); 
                completed = []; 
            } else if (listType === 'favorites') { 
                localStorage.removeItem(favKey); 
                favorites = []; 
            } else if (listType === 'watchlist') { 
                localStorage.removeItem(watchKey); 
                watchLater = []; 
            }

            refreshUI(); // Re-renders the list as empty
            
        } catch (e) {
            console.error("DB Wipe Failed:", e);
            alert("PORTAL ERROR: Could not clear the cloud database.");
        }
    }
}

if (localStorage.getItem("animeTheme") === "light") {
    document.body.classList.add("light-theme");
} else {
    document.body.classList.remove("light-theme");
}

     
refreshUI();
</script>
