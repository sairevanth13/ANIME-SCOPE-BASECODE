<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Scope | Ultra Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
       <div class="logo" onclick="sessionStorage.removeItem('animeScopeState'); location.href='index.html'">
    Anime<span>Scope</span>
</div>
        
        <div class="search-center">
          <div class="search-box">
    <span class="search-icon">◈</span>
    <input type="text" id="search" placeholder="ENTER ANIME NAME" autocomplete="off">
    <span id="clear-search" class="clear-btn">✕</span>
</div>
        </div>
        
        <div class="nav-right">

<button onclick="teleport()" class="teleport-btn">🎲 Random</button>

<div id="user-status">
<button onclick="saveState(); location.href='login.html'" class="login-trigger">LOG IN</button>
</div>

<div class="theme-container">
<label class="switch">
<input type="checkbox" id="toggle">
<span class="slider">
<span class="icon sun">☀</span>
<span class="icon moon">🌙</span>
</span>
</label>
</div>

</div>
    </header>

    <div id="genre-list" class="genre-container">
        <button class="genre-pill active" id="genre-0" onclick="filterByGenre(0, this)">All</button>
    </div>

    <div id="trending-section">
        <h2 class="section-title">🔥 Trending Now</h2>
        <div class="slider-wrapper">
            <button class="ctrl-btn left" onclick="slideLeft()">❮</button>
            <div id="trending-slider" class="trending-slider"></div>
            <button class="ctrl-btn right" onclick="slideRight()">❯</button>
        </div>
    </div>

    <h2 class="section-title" id="main-title">⭐ Top Rated Anime</h2>
    <div id="anime-container" class="anime-container"></div>

    <button id="backToTop" class="back-to-top">↑</button>
    
    <div id="loader" class="loader-container" style="display:none;"><div class="spinner"></div></div>

    <script src="script.js"></script>
    
</body>
</html>
